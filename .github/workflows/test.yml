name: Tests

# The app has no build step and no dependencies, so this is the only thing
# standing between a one-line edit and a broken log on somebody's phone.
#
# Pull requests only, not push-to-main: a merge lands the exact ref the PR
# already tested (GitHub runs pull_request against the merge result), so a
# second run on push would just repeat it.
#
# Only the headless half runs here. The browser smoke suite (test/smoke.js)
# needs a Chromium download on every run, so it moved to the machine the
# pull request is opened from: tools/smoke-gate.sh, wired as a Claude Code
# hook in .claude/settings.json that blocks the PR when it fails.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax-check every script
        run: for f in js/*.js sw.js test/*.js; do node --check "$f"; done

      - name: Run headless unit tests
        run: node test/unit.js

  # Shipping a new app.js while sw.js stays byte-identical means returning
  # users keep the old cached script forever: the browser only looks for a
  # worker update when the worker file itself changes. That shipped once
  # already (the Ajustes button wired to nothing), so it is checked here
  # rather than remembered.
  cache-version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a CACHE_VERSION bump when the app shell changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="origin/$BASE_REF"
          changed=$(git diff --name-only "$base"...HEAD)
          echo "Changed files:"; echo "$changed"

          if ! echo "$changed" | grep -qE '^(index\.html|css/|js/)'; then
            echo "No app-shell changes — nothing to check."
            exit 0
          fi

          old=$(git show "$base":sw.js | grep -m1 'CACHE_VERSION =')
          new=$(grep -m1 'CACHE_VERSION =' sw.js)
          echo "base: $old"
          echo "head: $new"

          if [ "$old" = "$new" ]; then
            echo
            echo "::error file=sw.js::The app shell changed but CACHE_VERSION did not."
            echo "Returning users would keep the cached copy of the old app.js."
            echo "Bump CACHE_VERSION in sw.js."
            exit 1
          fi
          echo "CACHE_VERSION was bumped."
