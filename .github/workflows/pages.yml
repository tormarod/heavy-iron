name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Refuse a shell that changed under a version already deployed
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # The PR check compares a branch with the base it was cut from, at
          # the moment it runs; two PRs cut from the same main each bump to the
          # same version and each pass. On 2026-09-22 #148, #149 and #150 all
          # shipped v113 within 34 s, so phones that took the first kept its
          # copies of the files the other two changed. So compare what is about
          # to be deployed with what the last push to main deployed.
          changed=$(git diff --name-only "$BEFORE" HEAD)
          if ! echo "$changed" | grep -qE '^(index\.html|css/.*\.css|js/.*\.js)$'; then
            echo "No app-shell changes since the last deploy."; exit 0
          fi
          old=$(git show "$BEFORE":sw.js | grep -m1 'CACHE_VERSION =')
          new=$(grep -m1 'CACHE_VERSION =' sw.js)
          echo "deployed: $old"; echo "this push: $new"
          if [ "$old" = "$new" ]; then
            echo "::error file=sw.js::The shell changed since the last deploy but CACHE_VERSION did not — two PRs probably made the same bump. Bump again on main."
            exit 1
          fi

  deploy:
    needs: guard
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
